plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.ponte'
version = '1.0.0'

android {
  namespace "app.ponte.wearsync"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Data Layer: o canal oficial do Google entre o celular e o relógio Wear OS.
  implementation 'com.google.android.gms:play-services-wearable:18.0.0'
}
